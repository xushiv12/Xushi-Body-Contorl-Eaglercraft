



























<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>徐氏猪肉炖菜游戏</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif}
main{max-width:1050px;margin:auto;padding:16px}
h1{text-align:center;font-size:27px}
canvas{
  width:100%;display:block;background:#85cfff;
  border:3px solid #486486;border-radius:12px
}
.controls,.inventory{
  display:flex;flex-wrap:wrap;gap:10px;margin:14px 0
}
button{
  background:#2679c3;color:white;border:0;border-radius:9px;
  padding:12px 16px;font-size:15px;cursor:pointer
}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.55;cursor:default}
#craftButton{background:#238653}
#buyButton{background:#a47a23}
#eatButton{background:#b26c2b}
.item{background:#24334b;padding:12px 16px;border-radius:9px}
#message{color:#ffe18b;min-height:30px}
#status{color:#b5d8ff}
.info{color:#d1def0;line-height:1.8}
</style>
</head>
<body>
<main>
<h1>徐氏猪肉炖菜游戏</h1>

<canvas id="game" width="960" height="540"></canvas>

<div class="controls">
  <button id="cameraButton">开启体感识别</button>
  <button id="resumeButton">动作1：继续 / 跳跃（测试）</button>
  <button id="stopButton">动作2：停止（测试）</button>
  <button id="craftButton">🍲 合成猪肉炖菜</button>
  <button id="buyButton">🪙 买（10个金币）</button>
  <button id="eatButton">🍴 吃</button>
  <button id="restartButton">重新开始</button>
</div>

<h3>背包</h3>
<div class="inventory">
  <div class="item">🥩 猪肉：<b id="porkCount">0</b></div>
  <div class="item">🍄 蘑菇：<b id="mushroomCount">0</b></div>
  <div class="item">🥣 碗：<b id="bowlCount">0</b></div>
  <div class="item">🪙 金币：<b id="coinCount">0</b></div>
  <div class="item">🍲 猪肉炖菜：<b id="stewCount">0</b></div>
</div>

<p id="message"></p>
<p id="status">正在开始游戏……</p>

<div class="info">
  show.js 原始 gyx：<b id="rawGyx">0</b><br>
  游戏当前控制指令：<b id="gyxDisplay">0</b><br>
  角色状态：<b id="stateDisplay">奔跑</b>
  <p>
    左手下垂，右手平伸：动作1，跳跃 / 恢复奔跑。<br>
    右手下垂，左手平伸：动作2，停止并收集2颗蘑菇。<br>
    每累计奔跑20秒，消耗1格鸡腿。<br>
    食物值归零，立即游戏失败。<br>
    合成：1个碗 + 1份猪肉 + 1颗蘑菇 = 1份炖菜。<br>
    购买：10金币换1份炖菜。<br>
    停止后吃炖菜，恢复1格鸡腿。<br>
    键盘：空格继续 / 跳跃，S停止，R重新开始。
  </p>
</div>
</main>

<!-- 直接使用你已经上传的 show.js -->
<script src="./show.js"></script>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;
const GROUND = 420;

const SPEED = 230;
const GRAVITY = 1800;
const JUMP_POWER = -720;

const MAX_HUNGER = 3;
const HUNGER_INTERVAL = 20;
const STEW_PRICE = 10;

const statusText = document.getElementById("status");
const messageText = document.getElementById("message");

const rawGyxText = document.getElementById("rawGyx");
const gyxDisplay = document.getElementById("gyxDisplay");
const stateDisplay = document.getElementById("stateDisplay");

let inventory;
let player;
let objects;

let hunger = 3;
let runningTime = 0;

let cameraX = 0;
let distance = 0;
let nextObjectX = 250;

// running, paused, over
let gameState = "running";

// 最近一次处理的指令
let lastCommand = "0";

// 测试按钮的指令，不会修改 show.js 的 gyx
let manualCommand = null;

// 是否启用了真实摄像头
let cameraEnabled = false;

// ====================================
// 消息与背包
// ====================================

function showMessage(text) {
  messageText.textContent = text;
}

function updateInventory() {
  for (const name of [
    "pork","mushroom","bowl","coin","stew"
  ]) {
    document.getElementById(name+"Count").textContent =
      inventory[name];
  }
}

function updateStateDisplay() {
  stateDisplay.textContent =
    gameState === "running" ? "奔跑" :
    gameState === "paused" ? "停止" : "游戏失败";
}

// ====================================
// 开始 / 重来
// ====================================

function restartGame() {
  inventory = {
    pork:0,
    mushroom:0,
    bowl:0,
    coin:0,
    stew:0
  };

  player = {
    x:100,
    y:GROUND-56,
    width:38,
    height:56,
    vy:0,
    grounded:true
  };

  objects = [];
  hunger = MAX_HUNGER;
  runningTime = 0;

  cameraX = 0;
  distance = 0;
  nextObjectX = 250;

  gameState = "running";

  // 测试状态清零；真实体感仍由 show.js 提供。
  manualCommand = null;

  // 重新开始时，允许当前姿态作为新指令处理。
  lastCommand = "0";

  generateObjects();
  updateInventory();
  updateStateDisplay();

  showMessage("");
  statusText.textContent = "游戏开始，角色自动向右奔跑。";
}

// ====================================
// 生成猪肉、金币和碗
// ====================================

function generateObjects() {
  while (nextObjectX < player.x+2400) {
    const random = Math.random();

    const type =
      random < .70 ? "pork" :
      random < .86 ? "coin" : "bowl";

    objects.push({
      x:nextObjectX,
      y:GROUND-55,
      type,
      collected:false
    });

    nextObjectX += 95+Math.random()*85;
  }
}

// ====================================
// 跳跃和继续奔跑
// ====================================

function jumpOrResume() {
  if (gameState === "over") return;

  const wasPaused = gameState === "paused";

  // 关键修复：
  // 停止状态下，只要收到动作1，就必须恢复。
  gameState = "running";

  if (player.grounded) {
    player.vy = JUMP_POWER;
    player.grounded = false;
  }

  updateStateDisplay();

  statusText.textContent = wasPaused
    ? "动作1识别成功！角色恢复奔跑。"
    : "动作1识别成功！角色跳跃。";
}

// ====================================
// 停止并收集蘑菇
// ====================================

function stopAndCollectMushrooms() {
  if (gameState !== "running") return;

  gameState = "paused";

  inventory.mushroom += 2;
  updateInventory();
  updateStateDisplay();

  showMessage("🍄 停止成功！获得2颗蘑菇。");

  statusText.textContent =
    "角色已停止，可以合成、购买或吃东西。";
}

// ====================================
// 游戏失败
// ====================================

function failGame() {
  if (gameState === "over") return;

  gameState = "over";
  hunger = 0;
  player.vy = 0;

  updateStateDisplay();

  showMessage("💀 食物值耗尽！游戏失败！");
  statusText.textContent =
    "游戏结束。点击重新开始进行下一局。";
}

// ====================================
// 读取体感指令：重要修复
// ====================================

function readGyx() {
  const raw = String(window.gyx ?? "0");
  rawGyxText.textContent = raw;

  const command = manualCommand !== null
    ? manualCommand
    : raw;

  gyxDisplay.textContent = command;

  if (gameState === "over") {
    lastCommand = command;
    return;
  }

  if (command === "1") {

    // 停止时，无条件恢复奔跑。
    // 奔跑时，只在新动作1到来时跳一次。
    if (
      gameState === "paused" ||
      lastCommand !== "1"
    ) {
      jumpOrResume();
    }
  }

  else if (command === "2") {

    // 奔跑时只停止一次，不会重复加蘑菇。
    if (gameState === "running") {
      stopAndCollectMushrooms();
    }
  }

  lastCommand = command;
}

// ====================================
// 测试按钮
// ====================================

function testAction1() {
  if (gameState === "over") return;

  manualCommand = "1";

  // 每次点击按钮都明确执行动作1。
  jumpOrResume();
  lastCommand = "1";
}

function testAction2() {
  if (gameState === "over") return;

  manualCommand = "2";
  stopAndCollectMushrooms();
  lastCommand = "2";
}

// ====================================
// 收集沿途物品
// ====================================

function collectObjects() {
  const px = player.x+player.width/2;
  const py = player.y+player.height/2;

  for (const obj of objects) {
    if (obj.collected) continue;

    const dx = Math.abs(px-obj.x);
    const dy = Math.abs(py-obj.y);

    if (dx < 36 && dy < 48) {
      obj.collected = true;
      inventory[obj.type]++;

      const names = {
        pork:"🥩 猪肉",
        coin:"🪙 金币",
        bowl:"🥣 碗"
      };

      updateInventory();
      showMessage("收集到1个："+names[obj.type]);
    }
  }
}

// ====================================
// 合成猪肉炖菜
// ====================================

function craftStew() {
  if (gameState === "over") {
    showMessage("❌ 游戏已失败，不能合成。");
    return;
  }

  const missing = [];

  if (inventory.bowl < 1) missing.push("碗");
  if (inventory.pork < 1) missing.push("猪肉");
  if (inventory.mushroom < 1) missing.push("蘑菇");

  if (missing.length > 0) {
    showMessage("❌ 缺少："+missing.join("、"));
    return;
  }

  inventory.bowl--;
  inventory.pork--;
  inventory.mushroom--;
  inventory.stew++;

  updateInventory();
  showMessage("🍲 合成成功！获得1份猪肉炖菜。");
}

// ====================================
// 买猪肉炖菜
// ====================================

function buyStew() {
  if (gameState === "over") {
    showMessage("❌ 游戏已经失败。");
    return;
  }

  if (gameState !== "paused") {
    showMessage("❌ 必须先停止才能购买！");
    return;
  }

  if (inventory.coin < STEW_PRICE) {
    showMessage(
      "❌ 金币不足！还差"+
      (STEW_PRICE-inventory.coin)+"个金币。"
    );
    return;
  }

  inventory.coin -= STEW_PRICE;
  inventory.stew++;

  updateInventory();
  showMessage("🪙 购买成功！获得1份猪肉炖菜。");
}

// ====================================
// 吃猪肉炖菜
// ====================================

function eatStew() {
  if (gameState === "over") {
    showMessage("❌ 游戏已经失败。");
    return;
  }

  if (gameState !== "paused") {
    showMessage("❌ 必须先停止才能吃！");
    return;
  }

  if (inventory.stew < 1) {
    showMessage("❌ 没有猪肉炖菜！");
    return;
  }

  if (hunger >= MAX_HUNGER) {
    showMessage("🍗 鸡腿已经满了！");
    return;
  }

  inventory.stew--;
  hunger++;

  updateInventory();
  showMessage("🍲 恢复1格鸡腿！");
}

// ====================================
// 饥饿值
// ====================================

function updateHunger(dt) {
  runningTime += dt;

  if (runningTime >= HUNGER_INTERVAL) {
    runningTime -= HUNGER_INTERVAL;
    hunger--;

    if (hunger <= 0) {
      failGame();
      return;
    }

    showMessage("🍗 奔跑20秒，减少1格鸡腿。");
  }
}

// ====================================
// 游戏更新
// ====================================

function update(dt) {
  readGyx();

  if (gameState !== "running") return;

  updateHunger(dt);

  if (gameState === "over") return;

  player.x += SPEED*dt;

  player.vy += GRAVITY*dt;
  player.y += player.vy*dt;

  if (
    player.y+player.height >= GROUND &&
    player.vy >= 0
  ) {
    player.y = GROUND-player.height;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  collectObjects();
  generateObjects();

  objects = objects.filter(
    obj => obj.x > player.x-900
  );

  cameraX = Math.max(0,player.x-210);
  distance = Math.floor(
    Math.max(0,player.x-100)/10
  );
}

// ====================================
// 背景
// ====================================

function drawBackground() {
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#75c7ff");
  sky.addColorStop(1,"#d8f4ff");

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = "rgba(255,255,255,.85)";

  for(let i=0;i<9;i++){
    const raw=i*240-cameraX*.2;
    const x=((raw%1300)+1300)%1300-120;
    const y=65+(i%3)*42;

    ctx.beginPath();
    ctx.ellipse(x,y,65,20,0,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle="#9ac4b6";

  for(let i=0;i<12;i++){
    const raw=i*200-cameraX*.35;
    const x=((raw%1350)+1350)%1350-130;

    ctx.beginPath();
    ctx.moveTo(x-120,GROUND);
    ctx.lineTo(x,260);
    ctx.lineTo(x+135,GROUND);
    ctx.closePath();
    ctx.fill();
  }
}

// ====================================
// 蘑菇
// ====================================

function drawMushroom(x,y){
  ctx.fillStyle="#fff0d3";
  ctx.fillRect(x-3,y-9,6,9);

  ctx.fillStyle="#d74747";
  ctx.beginPath();
  ctx.arc(x,y-9,9,Math.PI,0);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.fillRect(x-4,y-15,3,3);
  ctx.fillRect(x+3,y-14,3,3);
}

// ====================================
// 连续地面，无任何断坑
// ====================================

function drawGround(){
  ctx.fillStyle="#795038";
  ctx.fillRect(0,GROUND,W,H-GROUND);

  ctx.fillStyle="#66bf57";
  ctx.fillRect(0,GROUND,W,18);

  for(let i=0;i<22;i++){
    drawMushroom(
      i*65-cameraX%65+15,
      GROUND
    );
  }
}

// ====================================
// 猪肉、金币、碗
// ====================================

function drawObjects(){
  ctx.font="35px Arial";
  ctx.textAlign="center";

  const symbols={
    pork:"🥩",
    coin:"🪙",
    bowl:"🥣"
  };

  for(const obj of objects){
    if(obj.collected)continue;
    const x=obj.x-cameraX;
    if(x< -60||x>W+60)continue;
    ctx.fillText(
      symbols[obj.type],
      x,obj.y+12
    );
  }

  ctx.textAlign="left";
}

// ====================================
// 角色
// ====================================

function drawPlayer(){
  const x=player.x-cameraX;
  const y=player.y;

  ctx.fillStyle="#e8b48c";
  ctx.fillRect(x+8,y,23,21);

  ctx.fillStyle="#473225";
  ctx.fillRect(x+8,y,23,6);

  ctx.fillStyle="#222";
  ctx.fillRect(x+23,y+11,4,4);

  ctx.fillStyle="#287bc4";
  ctx.fillRect(x+5,y+21,29,25);

  ctx.fillStyle="#2c3859";
  ctx.fillRect(x+6,y+46,11,10);
  ctx.fillRect(x+24,y+46,11,10);

  ctx.fillStyle="#e8b48c";
  ctx.fillRect(x+33,y+25,5,15);
}

// ====================================
// 三格鸡腿
// ====================================

function drawDrumstick(x,y,filled){
  ctx.save();
  ctx.translate(x,y);
  ctx.globalAlpha=filled?1:.25;

  ctx.fillStyle="#f5e4c8";
  ctx.fillRect(13,16,6,12);

  ctx.beginPath();
  ctx.arc(13,28,4,0,Math.PI*2);
  ctx.arc(20,28,4,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle=filled?"#bb6829":"#64616a";
  ctx.beginPath();
  ctx.ellipse(14,11,12,10,-.45,0,Math.PI*2);
  ctx.fill();

  if(filled){
    ctx.fillStyle="#eba25e";
    ctx.beginPath();
    ctx.ellipse(10,7,6,3,-.45,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

// ====================================
// HUD
// ====================================

function drawHUD(){
  ctx.fillStyle="rgba(12,27,48,.83)";
  ctx.fillRect(15,15,325,115);
  ctx.fillStyle="white";

  ctx.font="bold 22px Arial";
  ctx.fillText("距离："+distance+" m",30,49);

  ctx.font="17px Arial";
  ctx.fillText(
    "猪肉："+inventory.pork+
    " 蘑菇："+inventory.mushroom,
    30,82
  );
  ctx.fillText(
    "金币："+inventory.coin+
    " 炖菜："+inventory.stew,
    30,113
  );

  ctx.fillStyle="rgba(12,27,48,.83)";
  ctx.fillRect(W-226,15,211,130);
  ctx.fillStyle="white";
  ctx.font="bold 20px Arial";
  ctx.fillText("食物值",W-210,42);

  for(let i=0;i<MAX_HUNGER;i++){
    drawDrumstick(
      W-210+i*53,48,i<hunger
    );
  }

  ctx.font="16px Arial";
  ctx.fillText(
    hunger+" / "+MAX_HUNGER,
    W-210,112
  );
  ctx.fillText(
    "GYX："+String(window.gyx??"0"),
    W-120,112
  );
}

// ====================================
// 停止和失败画面
// ====================================

function drawOverlay(title,subtitle,failed){
  ctx.fillStyle=failed
    ?"rgba(65,10,17,.94)"
    :"rgba(15,29,46,.85)";

  ctx.beginPath();
  ctx.roundRect(
    W/2-260,H/2-100,520,190,18
  );
  ctx.fill();

  ctx.textAlign="center";
  ctx.fillStyle=failed?"#ff7777":"white";
  ctx.font="bold 38px Arial";
  ctx.fillText(title,W/2,H/2-28);

  ctx.fillStyle="white";
  ctx.font="20px Arial";
  ctx.fillText(subtitle,W/2,H/2+25);

  if(failed){
    ctx.font="17px Arial";
    ctx.fillText(
      "点击“重新开始”按钮",
      W/2,H/2+60
    );
  }

  ctx.textAlign="left";
}

// ====================================
// 游戏主循环
// ====================================

let lastTime=performance.now();

function gameLoop(time){
  const dt=Math.min(
    (time-lastTime)/1000,.05
  );

  lastTime=time;
  update(dt);

  drawBackground();
  drawGround();
  drawObjects();
  drawPlayer();
  drawHUD();

  if(gameState==="over"){
    drawOverlay(
      "游戏失败！",
      "食物值已耗尽",
      true
    );
  }
  else if(gameState==="paused"){
    drawOverlay(
      "角色已停止",
      "动作1恢复奔跑；可以合成、购买、吃东西",
      false
    );
  }

  requestAnimationFrame(gameLoop);
}

// ====================================
// 启动已有的 show.js
// ====================================

const cameraButton=
  document.getElementById("cameraButton");

cameraButton.addEventListener("click",async()=>{
  if(
    typeof window.A!=="function" ||
    typeof window.B!=="function"
  ){
    statusText.textContent=
      "错误：show.js 未正确加载。";
    return;
  }

  cameraButton.disabled=true;
  statusText.textContent=
    "正在启动体感识别……";

  try{
    // 真实体感优先，不使用测试指令。
    manualCommand=null;
    lastCommand="0";

    await window.A();
    await window.B();

    cameraEnabled=true;

    cameraButton.textContent=
      "体感识别已开启";

    statusText.textContent=
      "体感已开启。动作1恢复/跳跃，动作2停止。";
  }
  catch(error){
    cameraButton.disabled=false;
    statusText.textContent=
      "体感启动失败："+(error.message||String(error));
  }
});

// ====================================
// 按钮控制
// ====================================

document.getElementById("resumeButton")
  .onclick=testAction1;

document.getElementById("stopButton")
  .onclick=testAction2;

document.getElementById("craftButton")
  .onclick=craftStew;

document.getElementById("buyButton")
  .onclick=buyStew;

document.getElementById("eatButton")
  .onclick=eatStew;

document.getElementById("restartButton")
  .onclick=restartGame;

// ====================================
// 键盘
// ====================================

document.addEventListener("keydown",e=>{
  if(e.code==="Space"){
    e.preventDefault();
    if(!e.repeat)testAction1();
  }

  if(e.code==="KeyS"&&!e.repeat){
    testAction2();
  }

  if(e.code==="KeyR"){
    restartGame();
  }
});

// ====================================
// 启动
// ====================================

restartGame();
requestAnimationFrame(gameLoop);

</script>
</body>
</html>

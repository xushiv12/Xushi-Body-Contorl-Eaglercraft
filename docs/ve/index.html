<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>徐氏超级炖菜游戏</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 1050px;
  margin: auto;
  padding: 16px;
}

h1 {
  font-size: 27px;
  text-align: center;
  margin: 15px 0 20px;
}

canvas {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #83c9ff;
  border: 3px solid #486486;
  border-radius: 12px;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 15px 0;
}

button {
  padding: 12px 16px;
  background: #2679c3;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.15);
}

button:disabled {
  opacity: 0.55;
  cursor: default;
}

#craftButton {
  background: #238653;
}

#eatButton {
  background: #b26c2b;
}

#buyButton {
  background: #a47a23;
}

#restartButton {
  background: #586477;
}

.inventory {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 12px 0;
}

.item {
  padding: 12px 16px;
  background: #24334b;
  border-radius: 9px;
  font-size: 17px;
}

#message {
  min-height: 30px;
  color: #ffe18b;
  font-size: 17px;
}

#status {
  color: #b5d8ff;
}

.instructions {
  line-height: 1.9;
  color: #d1def0;
}
</style>
</head>

<body>

<main>

<h1>徐氏超级炖菜游戏</h1>

<canvas
  id="game"
  width="960"
  height="540">
</canvas>

<div class="controls">

  <button id="cameraButton">
    开启体感识别
  </button>

  <button id="resumeButton">
    继续 / 跳跃（测试）
  </button>

  <button id="stopButton">
    停止（测试）
  </button>

  <button id="craftButton">
    🍲 合成猪肉炖菜
  </button>

  <button id="buyButton">
    🪙 买（10个金币）
  </button>

  <button id="eatButton">
    🍴 吃
  </button>

  <button id="restartButton">
    重新开始
  </button>

</div>

<h3>背包</h3>

<div class="inventory">

  <div class="item">
    🥩 猪肉：
    <b id="porkCount">0</b>
  </div>

  <div class="item">
    🍄 蘑菇：
    <b id="mushroomCount">0</b>
  </div>

  <div class="item">
    🥣 碗：
    <b id="bowlCount">0</b>
  </div>

  <div class="item">
    🪙 金币：
    <b id="coinCount">0</b>
  </div>

  <div class="item">
    🍲 猪肉炖菜：
    <b id="stewCount">0</b>
  </div>

</div>

<p id="message"></p>
<p id="status">
  角色正在自动奔跑。
</p>

<div class="instructions">

  当前 gyx：
  <b id="gyxDisplay">0</b>

  <p>
    动作1：左手下垂，右手平伸 → 跳跃或继续奔跑。<br>
    动作2：右手下垂，左手平伸 → 停止并收集2颗蘑菇。<br>
    每累计奔跑20秒，减少一格鸡腿。<br>
    停止后可以合成、购买或食用猪肉炖菜。<br>
    合成：1个碗 + 1份猪肉 + 1颗蘑菇。<br>
    购买：10个金币购买1份猪肉炖菜。<br>
    吃：消耗1份猪肉炖菜，恢复1格鸡腿。<br>
    键盘测试：空格跳跃，S停止，R重新开始。
  </p>

</div>

</main>

<!-- 你原来上传的体感库 -->
<script src="./show.js"></script>

<script>
"use strict";

// ===================================
// 基础参数
// ===================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const GROUND = 420;
const SPEED = 230;
const GRAVITY = 1800;
const JUMP_POWER = -720;

const MAX_HUNGER = 3;
const HUNGER_INTERVAL = 20;
const STEW_PRICE = 10;

const statusText =
  document.getElementById("status");

const messageText =
  document.getElementById("message");

const gyxDisplay =
  document.getElementById("gyxDisplay");

// ===================================
// 游戏变量
// ===================================

let player;
let objects;
let inventory;

let hunger = MAX_HUNGER;
let runningTime = 0;

let cameraX = 0;
let distance = 0;
let nextObjectX = 250;

let isStopped = false;
let lastGyx = "0";

// ===================================
// 提示
// ===================================

function showMessage(text) {
  messageText.textContent = text;
}

// ===================================
// 更新背包
// ===================================

function updateInventory() {

  document.getElementById("porkCount").textContent =
    inventory.pork;

  document.getElementById("mushroomCount").textContent =
    inventory.mushroom;

  document.getElementById("bowlCount").textContent =
    inventory.bowl;

  document.getElementById("coinCount").textContent =
    inventory.coin;

  document.getElementById("stewCount").textContent =
    inventory.stew;
}

// ===================================
// 初始化游戏
// ===================================

function restartGame() {

  inventory = {
    pork: 0,
    mushroom: 0,
    bowl: 0,
    coin: 0,
    stew: 0
  };

  player = {
    x: 100,
    y: GROUND - 56,
    width: 38,
    height: 56,
    vy: 0,
    grounded: true
  };

  objects = [];

  hunger = MAX_HUNGER;
  runningTime = 0;

  cameraX = 0;
  distance = 0;

  nextObjectX = 250;

  isStopped = false;

  // 保留 show.js 当前的识别状态
  lastGyx = String(window.gyx ?? "0");

  generateObjects();
  updateInventory();

  showMessage("");

  statusText.textContent =
    "徐氏超级炖菜游戏开始！角色正在奔跑。";
}

// ===================================
// 生成可收集物品
// ===================================

function generateObjects() {

  while (nextObjectX < player.x + 2400) {

    const chance = Math.random();

    let type;

    if (chance < 0.70) {
      type = "pork";
    }
    else if (chance < 0.86) {
      type = "coin";
    }
    else {
      type = "bowl";
    }

    objects.push({
      x: nextObjectX,
      y: GROUND - 55,
      type: type,
      collected: false
    });

    nextObjectX +=
      95 + Math.random() * 85;
  }
}

// ===================================
// 跳跃 / 继续奔跑
// ===================================

function jumpOrResume() {

  isStopped = false;

  if (player.grounded) {

    player.vy = JUMP_POWER;
    player.grounded = false;

  }

  statusText.textContent =
    "角色正在奔跑。";
}

// ===================================
// 停止并收集蘑菇
// ===================================

function stopAndCollectMushrooms() {

  // 持续停止不能重复收集
  if (isStopped) {
    return;
  }

  isStopped = true;

  inventory.mushroom += 2;

  updateInventory();

  showMessage(
    "🍄 角色停止，收集到2颗蘑菇！"
  );

  statusText.textContent =
    "角色已停止，可以合成、购买或吃东西。";
}

// ===================================
// 读取 show.js 的 gyx
// ===================================

function readGyx() {

  const value =
    String(window.gyx ?? "0");

  gyxDisplay.textContent = value;

  // 只在指令变化时触发动作
  if (value !== lastGyx) {

    if (value === "1") {
      jumpOrResume();
    }

    else if (value === "2") {
      stopAndCollectMushrooms();
    }

  }

  lastGyx = value;
}

// ===================================
// 收集猪肉、金币和碗
// ===================================

function collectObjects() {

  const px =
    player.x + player.width / 2;

  const py =
    player.y + player.height / 2;

  for (const obj of objects) {

    if (obj.collected) {
      continue;
    }

    const dx =
      Math.abs(px - obj.x);

    const dy =
      Math.abs(py - obj.y);

    if (dx < 36 && dy < 48) {

      obj.collected = true;

      inventory[obj.type]++;

      const names = {
        pork: "🥩 猪肉",
        coin: "🪙 金币",
        bowl: "🥣 碗"
      };

      showMessage(
        "获得1个物品：" + names[obj.type]
      );

      updateInventory();
    }
  }
}

// ===================================
// 合成猪肉炖菜
// ===================================

function craftStew() {

  const missing = [];

  if (inventory.bowl < 1) {
    missing.push("碗");
  }

  if (inventory.pork < 1) {
    missing.push("猪肉");
  }

  if (inventory.mushroom < 1) {
    missing.push("蘑菇");
  }

  if (missing.length > 0) {

    showMessage(
      "❌ 无法合成！缺少：" +
      missing.join("、")
    );

    return;
  }

  inventory.bowl--;
  inventory.pork--;
  inventory.mushroom--;

  inventory.stew++;

  updateInventory();

  showMessage(
    "🍲 合成成功！获得1份猪肉炖菜。"
  );
}

// ===================================
// 商店：买猪肉炖菜
// ===================================

function buyStew() {

  // 必须停下来才能购买
  if (!isStopped) {

    showMessage(
      "❌ 请先停止奔跑，再购买猪肉炖菜！"
    );

    return;
  }

  // 需要10个金币
  if (inventory.coin < STEW_PRICE) {

    const missing =
      STEW_PRICE - inventory.coin;

    showMessage(
      "❌ 金币不足！需要10个金币，" +
      "你还差" + missing + "个金币。"
    );

    return;
  }

  // 扣金币
  inventory.coin -= STEW_PRICE;

  // 获得炖菜
  inventory.stew++;

  updateInventory();

  showMessage(
    "✅ 购买成功！花费10个金币，" +
    "获得1份猪肉炖菜。"
  );
}

// ===================================
// 吃猪肉炖菜
// ===================================

function eatStew() {

  // 必须停止才能吃
  if (!isStopped) {

    showMessage(
      "❌ 请先停止奔跑，再吃猪肉炖菜！"
    );

    return;
  }

  // 没有炖菜
  if (inventory.stew < 1) {

    showMessage(
      "❌ 背包里没有猪肉炖菜！"
    );

    return;
  }

  // 鸡腿不能超过3
  if (hunger >= MAX_HUNGER) {

    showMessage(
      "🍗 鸡腿已经满了，不能继续吃！"
    );

    return;
  }

  // 消耗一份炖菜
  inventory.stew--;

  // 恢复一格鸡腿
  hunger = Math.min(
    MAX_HUNGER,
    hunger + 1
  );

  updateInventory();

  showMessage(
    "🍲 吃掉1份猪肉炖菜，恢复1格鸡腿！"
  );
}

// ===================================
// 饥饿系统
// ===================================

function updateHunger(dt) {

  if (hunger <= 0) {
    return;
  }

  runningTime += dt;

  // 每累计奔跑20秒消耗一格
  while (runningTime >= HUNGER_INTERVAL) {

    runningTime -= HUNGER_INTERVAL;

    hunger--;

    if (hunger <= 0) {

      hunger = 0;

      showMessage(
        "⚠️ 鸡腿耗尽！可以停下吃炖菜。"
      );

      break;
    }

    showMessage(
      "🍗 奔跑20秒，减少1格鸡腿。"
    );
  }
}

// ===================================
// 游戏更新
// ===================================

function update(dt) {

  // 每一帧读取当前 gyx
  readGyx();

  if (isStopped) {
    return;
  }

  updateHunger(dt);

  // 自动向右奔跑
  player.x += SPEED * dt;

  // 跳跃与重力
  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;

  // 连续地面，无断坑
  if (
    player.y + player.height >= GROUND &&
    player.vy >= 0
  ) {

    player.y =
      GROUND - player.height;

    player.vy = 0;
    player.grounded = true;

  }
  else {

    player.grounded = false;

  }

  collectObjects();

  generateObjects();

  // 清理屏幕后方旧物品
  objects = objects.filter(
    obj => obj.x > player.x - 900
  );

  cameraX =
    Math.max(0, player.x - 210);

  distance = Math.floor(
    Math.max(0, player.x - 100) / 10
  );
}

// ===================================
// 天空背景
// ===================================

function drawBackground() {

  const sky =
    ctx.createLinearGradient(
      0, 0, 0, H
    );

  sky.addColorStop(0, "#75c7ff");
  sky.addColorStop(1, "#d8f4ff");

  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // 云
  ctx.fillStyle =
    "rgba(255,255,255,0.85)";

  for (let i = 0; i < 9; i++) {

    const raw =
      i * 240 - cameraX * 0.2;

    const x =
      ((raw % 1300) + 1300) %
      1300 - 120;

    const y =
      65 + (i % 3) * 42;

    ctx.beginPath();

    ctx.ellipse(
      x, y, 65, 20,
      0, 0, Math.PI * 2
    );

    ctx.fill();
  }

  // 远山
  ctx.fillStyle = "#9ac4b6";

  for (let i = 0; i < 12; i++) {

    const raw =
      i * 200 - cameraX * 0.35;

    const x =
      ((raw % 1350) + 1350) %
      1350 - 130;

    ctx.beginPath();

    ctx.moveTo(
      x - 120, GROUND
    );

    ctx.lineTo(
      x, 260
    );

    ctx.lineTo(
      x + 135, GROUND
    );

    ctx.closePath();
    ctx.fill();
  }
}

// ===================================
// 蘑菇
// ===================================

function drawMushroom(x, y) {

  // 蘑菇柄
  ctx.fillStyle = "#fff0d3";

  ctx.fillRect(
    x - 3, y - 9, 6, 9
  );

  // 红色蘑菇帽
  ctx.fillStyle = "#d74747";

  ctx.beginPath();

  ctx.arc(
    x, y - 9, 9,
    Math.PI, 0
  );

  ctx.fill();

  // 白点
  ctx.fillStyle = "white";

  ctx.fillRect(
    x - 4, y - 15, 3, 3
  );

  ctx.fillRect(
    x + 3, y - 14, 3, 3
  );
}

// ===================================
// 连续地面
// ===================================

function drawGround() {

  // 泥土
  ctx.fillStyle = "#795038";

  ctx.fillRect(
    0, GROUND,
    W, H - GROUND
  );

  // 草地
  ctx.fillStyle = "#66bf57";

  ctx.fillRect(
    0, GROUND,
    W, 18
  );

  // 满地的蘑菇
  for (let i = 0; i < 22; i++) {

    drawMushroom(
      i * 65 -
      cameraX % 65 + 15,
      GROUND
    );
  }
}

// ===================================
// 沿途物品
// ===================================

function drawObjects() {

  ctx.font = "35px Arial";
  ctx.textAlign = "center";

  for (const obj of objects) {

    if (obj.collected) {
      continue;
    }

    const x =
      obj.x - cameraX;

    if (x < -60 || x > W + 60) {
      continue;
    }

    const symbols = {
      pork: "🥩",
      coin: "🪙",
      bowl: "🥣"
    };

    ctx.fillText(
      symbols[obj.type],
      x,
      obj.y + 12
    );
  }

  ctx.textAlign = "left";
}

// ===================================
// 角色
// ===================================

function drawPlayer() {

  const x =
    player.x - cameraX;

  const y = player.y;

  // 头
  ctx.fillStyle = "#e8b48c";
  ctx.fillRect(x + 8, y, 23, 21);

  // 头发
  ctx.fillStyle = "#473225";
  ctx.fillRect(x + 8, y, 23, 6);

  // 眼睛
  ctx.fillStyle = "#222";
  ctx.fillRect(x + 23, y + 11, 4, 4);

  // 衣服
  ctx.fillStyle = "#287bc4";
  ctx.fillRect(x + 5, y + 21, 29, 25);

  // 双腿
  ctx.fillStyle = "#2c3859";
  ctx.fillRect(x + 6, y + 46, 11, 10);
  ctx.fillRect(x + 24, y + 46, 11, 10);

  // 手
  ctx.fillStyle = "#e8b48c";
  ctx.fillRect(x + 33, y + 25, 5, 15);
}

// ===================================
// Minecraft 风格鸡腿
// ===================================

function drawDrumstick(x, y, filled) {

  ctx.save();
  ctx.translate(x, y);

  ctx.globalAlpha =
    filled ? 1 : 0.3;

  // 骨头
  ctx.fillStyle = "#f5e4c8";

  ctx.fillRect(
    13, 16, 6, 12
  );

  ctx.beginPath();

  ctx.arc(
    13, 28, 4,
    0, Math.PI * 2
  );

  ctx.arc(
    20, 28, 4,
    0, Math.PI * 2
  );

  ctx.fill();

  // 肉
  ctx.fillStyle =
    filled ? "#bb6829" : "#64616a";

  ctx.beginPath();

  ctx.ellipse(
    14, 11,
    12, 10,
    -0.45, 0,
    Math.PI * 2
  );

  ctx.fill();

  if (filled) {

    ctx.fillStyle = "#eba25e";

    ctx.beginPath();

    ctx.ellipse(
      10, 7,
      6, 3,
      -0.45, 0,
      Math.PI * 2
    );

    ctx.fill();
  }

  ctx.restore();
}

// ===================================
// 游戏状态栏
// ===================================

function drawHUD() {

  ctx.fillStyle =
    "rgba(12,27,48,0.83)";

  ctx.fillRect(
    15, 15, 325, 115
  );

  ctx.fillStyle = "white";

  ctx.font = "bold 22px Arial";

  ctx.fillText(
    "距离：" + distance + " m",
    30, 49
  );

  ctx.font = "17px Arial";

  ctx.fillText(
    "猪肉：" + inventory.pork +
    "  蘑菇：" + inventory.mushroom,
    30, 82
  );

  ctx.fillText(
    "金币：" + inventory.coin +
    "  炖菜：" + inventory.stew,
    30, 113
  );

  // 食物值背景
  ctx.fillStyle =
    "rgba(12,27,48,0.83)";

  ctx.fillRect(
    W - 226, 15, 211, 130
  );

  ctx.fillStyle = "white";
  ctx.font = "bold 20px Arial";

  ctx.fillText(
    "食物值",
    W - 210, 42
  );

  // 三个鸡腿
  for (
    let i = 0;
    i < MAX_HUNGER;
    i++
  ) {

    drawDrumstick(
      W - 210 + i * 53,
      48,
      i < hunger
    );
  }

  ctx.font = "16px Arial";

  ctx.fillText(
    hunger + " / " + MAX_HUNGER,
    W - 210, 112
  );

  ctx.fillText(
    "GYX：" +
    String(window.gyx ?? "0"),
    W - 120, 112
  );
}

// ===================================
// 停止状态
// ===================================

function drawStopped() {

  if (!isStopped) {
    return;
  }

  ctx.fillStyle =
    "rgba(15,29,46,0.83)";

  ctx.beginPath();

  ctx.roundRect(
    W / 2 - 245,
    H / 2 - 85,
    490, 150, 16
  );

  ctx.fill();

  ctx.fillStyle = "white";
  ctx.textAlign = "center";

  ctx.font = "bold 29px Arial";

  ctx.fillText(
    "角色已停止",
    W / 2,
    H / 2 - 32
  );

  ctx.font = "19px Arial";

  ctx.fillText(
    "可以合成、购买或食用猪肉炖菜",
    W / 2,
    H / 2 + 10
  );

  ctx.fillText(
    "做动作1继续奔跑",
    W / 2,
    H / 2 + 43
  );

  ctx.textAlign = "left";
}

// ===================================
// 游戏主循环
// ===================================

let lastTime =
  performance.now();

function gameLoop(time) {

  const dt = Math.min(
    (time - lastTime) / 1000,
    0.04
  );

  lastTime = time;

  update(dt);

  drawBackground();
  drawGround();
  drawObjects();
  drawPlayer();
  drawHUD();
  drawStopped();

  requestAnimationFrame(
    gameLoop
  );
}

// ===================================
// 启动现有 show.js
// ===================================

const cameraButton =
  document.getElementById(
    "cameraButton"
  );

cameraButton.addEventListener(
  "click",
  async function() {

    if (
      typeof window.A !== "function" ||
      typeof window.B !== "function"
    ) {

      statusText.textContent =
        "错误：show.js 没有加载成功。";

      return;
    }

    cameraButton.disabled = true;

    statusText.textContent =
      "正在启动摄像头……";

    try {

      await window.A();
      await window.B();

      cameraButton.textContent =
        "体感识别已开启";

      statusText.textContent =
        "摄像头已启动，可以使用体感控制！";

    }
    catch (error) {

      cameraButton.disabled = false;

      statusText.textContent =
        "摄像头启动失败：" +
        (error.message || String(error));
    }
  }
);

// ===================================
// 游戏按钮
// ===================================

document.getElementById(
  "resumeButton"
).addEventListener(
  "click",
  jumpOrResume
);

document.getElementById(
  "stopButton"
).addEventListener(
  "click",
  stopAndCollectMushrooms
);

document.getElementById(
  "craftButton"
).addEventListener(
  "click",
  craftStew
);

document.getElementById(
  "buyButton"
).addEventListener(
  "click",
  buyStew
);

document.getElementById(
  "eatButton"
).addEventListener(
  "click",
  eatStew
);

document.getElementById(
  "restartButton"
).addEventListener(
  "click",
  restartGame
);

// ===================================
// 键盘控制
// ===================================

document.addEventListener(
  "keydown",
  function(e) {

    if (e.code === "Space") {

      e.preventDefault();

      if (!e.repeat) {
        jumpOrResume();
      }
    }

    if (e.code === "KeyS") {

      if (!e.repeat) {
        stopAndCollectMushrooms();
      }
    }

    if (e.code === "KeyR") {
      restartGame();
    }
  }
);

// ===================================
// 开始游戏
// ===================================

restartGame();

requestAnimationFrame(
  gameLoop
);

</script>

</body>
</html>
